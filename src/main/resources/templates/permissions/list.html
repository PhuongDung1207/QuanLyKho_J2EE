<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permissions – WMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="wms-main">
    <div class="container-fluid p-4">
        <div class="d-flex align-items-center mb-4">
            <div>
                <h1 class="h4 fw-bold mb-0" style="color:#1a1a2e"><i class="bi bi-key me-2" style="color:#f26722"></i>Permissions</h1>
                <p class="text-muted small mb-0">Danh sách tất cả quyền trong hệ thống</p>
            </div>
        </div>

        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-header bg-white border-0 px-4 pt-3 pb-2">
                <div class="row g-2 align-items-center">
                    <div class="col-md-8">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text bg-white border-end-0">
                                <i class="bi bi-search text-muted"></i>
                            </span>
                            <input id="permissionSearchInput" type="text" class="form-control border-start-0 ps-0"
                                   placeholder="Search by code, module, or name...">
                        </div>
                    </div>
                    <div class="col-md-4 text-md-end">
                        <small id="permissionTableCount" class="text-muted fw-semibold"
                               th:text="${permissions.size()} + ' permissions'">0 permissions</small>
                    </div>
                </div>
            </div>
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead style="background:#f8fafc;">
                    <tr>
                        <th class="px-4 py-3 text-uppercase small text-muted fw-semibold border-0" style="font-size:.72rem;letter-spacing:.06em">Code</th>
                        <th class="px-4 py-3 text-uppercase small text-muted fw-semibold border-0" style="font-size:.72rem;letter-spacing:.06em">Module</th>
                        <th class="px-4 py-3 text-uppercase small text-muted fw-semibold border-0" style="font-size:.72rem;letter-spacing:.06em">Tên</th>
                    </tr>
                    </thead>
                    <tbody id="permissionsBody">
                    <tr th:each="p : ${permissions}" th:attr="data-code=${p.code}, data-module=${p.module}, data-name=${p.name}">
                        <td class="px-4 py-3 fw-semibold">
                            <span class="badge rounded-pill px-3 py-2" style="background:#eff6ff;color:#1d4ed8;font-size:.72rem" th:text="${p.code}">PRODUCT_VIEW</span>
                        </td>
                        <td class="px-4 py-3 text-muted" th:text="${p.module}">MASTER_DATA</td>
                        <td class="px-4 py-3" th:text="${p.name}">Xem sản phẩm</td>
                    </tr>
                    <tr id="permissionNoResultRow" style="display:none">
                        <td colspan="3" class="text-center py-5 text-muted">
                            <i class="bi bi-search d-block mb-2" style="font-size:2rem;opacity:.3"></i>
                            No matching permissions
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(permissions)}">
                        <td colspan="3" class="text-center py-5 text-muted">
                            <i class="bi bi-inbox d-block mb-2" style="font-size:2rem;opacity:.3"></i>
                            Chưa có permission
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        var searchInput = document.getElementById('permissionSearchInput');
        if (!searchInput) return;

        var noResultRow = document.getElementById('permissionNoResultRow');
        var tableCount = document.getElementById('permissionTableCount');

        function applyFilter() {
            var q = (searchInput.value || '').trim().toLowerCase();
            var rows = document.querySelectorAll('#permissionsBody tr[data-code]');
            var visible = 0;

            rows.forEach(function (row) {
                var code = (row.dataset.code || '').toLowerCase();
                var module = (row.dataset.module || '').toLowerCase();
                var name = (row.dataset.name || '').toLowerCase();
                var match = !q || code.includes(q) || module.includes(q) || name.includes(q);
                row.style.display = match ? '' : 'none';
                if (match) visible++;
            });

            if (noResultRow) {
                noResultRow.style.display = (rows.length > 0 && visible === 0) ? '' : 'none';
            }
            if (tableCount) {
                tableCount.textContent = visible + ' permissions';
            }
        }

        searchInput.addEventListener('input', applyFilter);
        applyFilter();
    })();
</script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Permissions</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container mt-4">
    <h1 class="mb-4">Permissions</h1>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>Code</th>
            <th>Module</th>
            <th>Name</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${permissions}">
            <td th:text="${p.code}">PRODUCT_VIEW</td>
            <td th:text="${p.module}">MASTER_DATA</td>
            <td th:text="${p.name}">Xem sản phẩm</td>
        </tr>
        <tr th:if="${#lists.isEmpty(permissions)}">
            <td colspan="3" class="text-center">Chưa có permission</td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Người dùng</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        .roles-badge { margin-right: 4px; }
    </style>
    </head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8">
            <h1 class="mb-4">Người dùng</h1>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Username</th>
                    <th>Trạng thái</th>
                    <th>Roles</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${users}">
                    <td th:text="${u.username}">user</td>
                    <td th:text="${u.status}">ACTIVE</td>
                    <td>
                        <span th:each="r : ${u.roles}" class="badge text-bg-secondary roles-badge" th:text="${r.code}">ROLE</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="3" class="text-center">Chưa có người dùng</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="col-md-4">
            <h2 class="h5">Thêm người dùng</h2>
            <form th:action="@{/users}" th:object="${createForm}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input id="username" type="text" class="form-control" th:field="*{username}">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Mật khẩu</label>
                    <input id="password" type="password" class="form-control" th:field="*{password}">
                </div>
                <div class="mb-3">
                    <label for="status" class="form-label">Trạng thái</label>
                    <select id="status" class="form-select" th:field="*{status}">
                        <option value="ACTIVE">ACTIVE</option>
                        <option value="LOCKED">LOCKED</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Roles</label>
                    <select multiple class="form-select" th:field="*{roleIds}" size="6">
                        <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.code}">ADMIN</option>
                    </select>
                    <div class="form-text">Giữ Ctrl/Cmd để chọn nhiều</div>
                </div>
                <button type="submit" class="btn btn-primary">Lưu người dùng</button>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card mt-5 shadow-sm">
                <div class="card-body">
                    <h1 class="h4 mb-3 text-center">Đăng nhập</h1>
                    <div class="alert alert-danger" th:if="${error != null}" th:text="${error}"></div>
                    <form th:action="@{/login}" th:object="${loginForm}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Tài khoản</label>
                            <input id="username" type="text" class="form-control" th:field="*{username}">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Mật khẩu</label>
                            <input id="password" type="password" class="form-control" th:field="*{password}">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
                    </form>
                </div>
            </div>
            <p class="text-center text-muted small mt-3">Tài khoản mặc định: admin / Admin@123</p>
        </div>
    </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

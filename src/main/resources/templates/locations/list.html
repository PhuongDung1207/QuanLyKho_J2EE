<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vị trí kho</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8">
            <h1 class="mb-3">Vị trí - <span th:text="${warehouse.name}">Kho</span></h1>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Code</th>
                    <th>Type</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="loc : ${locations}">
                    <td th:text="${loc.code}">A-01-01</td>
                    <td th:text="${loc.type}">BIN</td>
                </tr>
                <tr th:if="${#lists.isEmpty(locations)}">
                    <td colspan="2" class="text-center">Chưa có vị trí</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="col-md-4">
            <h2 class="h5">Thêm vị trí</h2>
            <form th:action="@{'/warehouses/' + ${warehouse.id} + '/locations'}" th:object="${createForm}" method="post">
                <div class="mb-3">
                    <label for="code" class="form-label">Mã vị trí</label>
                    <input id="code" type="text" class="form-control" th:field="*{code}">
                </div>
                <div class="mb-3">
                    <label for="type" class="form-label">Loại</label>
                    <input id="type" type="text" class="form-control" th:field="*{type}">
                </div>
                <button type="submit" class="btn btn-primary">Lưu vị trí</button>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

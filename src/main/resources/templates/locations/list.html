<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vị trí kho – WMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="wms-main">
    <div class="container-fluid p-4">
        <div class="d-flex align-items-center mb-4">
            <a href="/warehouses" class="btn btn-sm btn-outline-secondary rounded-2 me-3">
                <i class="bi bi-arrow-left me-1"></i>Kho
            </a>
            <div>
                <h1 class="h4 fw-bold mb-0" style="color:#1a1a2e">
                    <i class="bi bi-geo-alt me-2" style="color:#f26722"></i>Vị trí –
                    <span th:text="${warehouse.name}">Kho</span>
                </h1>
                <p class="text-muted small mb-0">Quản lý vị trí trong kho hàng</p>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-8">
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-header bg-white border-0 px-4 pt-3 pb-2">
                        <div class="row g-2 align-items-center">
                            <div class="col-md-8">
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text bg-white border-end-0">
                                        <i class="bi bi-search text-muted"></i>
                                    </span>
                                    <input id="locationSearchInput" type="text" class="form-control border-start-0 ps-0"
                                           placeholder="Search by location code or type...">
                                </div>
                            </div>
                            <div class="col-md-4 text-md-end">
                                <small id="locationTableCount" class="text-muted fw-semibold"
                                       th:text="${locations.size()} + ' locations'">0 locations</small>
                            </div>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-hover mb-0">
                            <thead style="background:#f8fafc;">
                            <tr>
                                <th class="px-4 py-3 text-uppercase small text-muted fw-semibold border-0" style="font-size:.72rem;letter-spacing:.06em">Mã vị trí</th>
                                <th class="px-4 py-3 text-uppercase small text-muted fw-semibold border-0" style="font-size:.72rem;letter-spacing:.06em">Loại</th>
                            </tr>
                            </thead>
                            <tbody id="locationsBody">
                            <tr th:each="loc : ${locations}" th:attr="data-code=${loc.code}, data-type=${loc.type}">
                                <td class="px-4 py-3 fw-semibold" th:text="${loc.code}">A-01-01</td>
                                <td class="px-4 py-3">
                                    <span class="badge rounded-pill px-3 py-2" style="background:#f0fdf4;color:#15803d;font-size:.72rem" th:text="${loc.type}">BIN</span>
                                </td>
                            </tr>
                            <tr id="locationNoResultRow" style="display:none">
                                <td colspan="2" class="text-center py-5 text-muted">
                                    <i class="bi bi-search d-block mb-2" style="font-size:2rem;opacity:.3"></i>
                                    No matching locations
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(locations)}">
                                <td colspan="2" class="text-center py-5 text-muted">
                                    <i class="bi bi-inbox d-block mb-2" style="font-size:2rem;opacity:.3"></i>
                                    Chưa có vị trí
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-header bg-white border-0 pt-3 pb-2 px-4">
                        <h5 class="fw-bold mb-0" style="font-size:.95rem"><i class="bi bi-plus-circle me-2" style="color:#f26722"></i>Thêm vị trí</h5>
                    </div>
                    <div class="card-body px-4 pb-4">
                        <form th:action="@{'/warehouses/' + ${warehouse.id} + '/locations'}" th:object="${createForm}" method="post">
                            <div class="mb-3">
                                <label for="code" class="form-label small fw-semibold">Mã vị trí</label>
                                <input id="code" type="text" class="form-control rounded-2" th:field="*{code}" placeholder="VD: A-01-01">
                            </div>
                            <div class="mb-4">
                                <label for="type" class="form-label small fw-semibold">Loại</label>
                                <input id="type" type="text" class="form-control rounded-2" th:field="*{type}" placeholder="VD: BIN">
                            </div>
                            <button type="submit" class="btn w-100 fw-semibold text-white rounded-2" style="background:#f26722;border:none">
                                <i class="bi bi-save me-1"></i>Lưu vị trí
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        var searchInput = document.getElementById('locationSearchInput');
        if (!searchInput) return;

        var noResultRow = document.getElementById('locationNoResultRow');
        var tableCount = document.getElementById('locationTableCount');

        function applyFilter() {
            var q = (searchInput.value || '').trim().toLowerCase();
            var rows = document.querySelectorAll('#locationsBody tr[data-code]');
            var visible = 0;

            rows.forEach(function (row) {
                var code = (row.dataset.code || '').toLowerCase();
                var type = (row.dataset.type || '').toLowerCase();
                var match = !q || code.includes(q) || type.includes(q);
                row.style.display = match ? '' : 'none';
                if (match) visible++;
            });

            if (noResultRow) {
                noResultRow.style.display = (rows.length > 0 && visible === 0) ? '' : 'none';
            }
            if (tableCount) {
                tableCount.textContent = visible + ' locations';
            }
        }

        searchInput.addEventListener('input', applyFilter);
        applyFilter();
    })();
</script>
</body>
</html>

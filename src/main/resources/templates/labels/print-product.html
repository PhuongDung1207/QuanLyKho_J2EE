<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>In Tem Mã Vạch Sản Phẩm</title>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        .label {
            width: 500px;
            height: 190px;
            border: 1px dashed #000;
            padding: 10px;
            text-align: center;
            box-sizing: border-box;
            background: #fff;
            page-break-inside: avoid;
        }
        .product-name { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .product-sku { font-size: 14px; margin-bottom: 8px; }
        .barcode { max-width: 100%; height: auto; max-height: 110px; }
        
        @media print {
            body { margin: 0; }
            .label { border: none; page-break-inside: avoid; }
            @page { size: 500px 190px; margin: 0; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
</head>
<body>
    <div class="label">
        <div class="product-name" th:text="${product.name}">Product Name</div>
        <div class="product-sku" th:text="'SKU: ' + ${product.sku}">SKU: 0001</div>
        <svg id="barcode" class="barcode"></svg>
    </div>
    <script th:inline="javascript">
        /*<![CDATA[*/
        window.onload = function() {
            var barcodeValue = /*[[${product.barcode}]]*/ 'PRD-DEFAULT';
            JsBarcode("#barcode", barcodeValue, {
                format: "CODE128",
                width: 3,
                height: 90,
                displayValue: true,
                fontSize: 12,
                margin: 20
            });
            setTimeout(function() {
                window.print();
            }, 500);
        };
        /*]]>*/
    </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>In Tem QR Lô Hàng</title>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        .label {
            width: 300px;
            height: 300px;
            border: 1px dashed #000;
            padding: 15px;
            text-align: center;
            box-sizing: border-box;
            background: #fff;
        }
        .batch-code { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
        .product-name { font-size: 14px; margin-bottom: 5px; }
        .date { font-size: 12px; margin-bottom: 15px; }
        .qrcode { max-width: 100%; height: auto; max-height: 180px; image-rendering: pixelated; }
        
        @media print {
            body { margin: 0; }
            .label { border: none; }
            @page { size: 300px 300px; margin: 0; }
        }
    </style>
</head>
<body onload="window.print()">
    <div class="label">
        <div class="batch-code" th:text="'Lô: ' + ${batch.code}">Lô: BATCH001</div>
        <div class="product-name" th:text="${product.name}">Product Name</div>
        <div class="date">
            <span th:if="${batch.mfgDate}" th:text="'NSX: ' + ${batch.mfgDate}"></span>
            <br th:if="${batch.expDate}"/>
            <span th:if="${batch.expDate}" th:text="'HSD: ' + ${batch.expDate}"></span>
        </div>
        <img class="qrcode" th:src="@{/api/v1/labels/batch/{code}/qr(code=${batch.code})}" alt="QR Code"/>
    </div>
</body>
</html>

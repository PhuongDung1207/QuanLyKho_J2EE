<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Roles & Permissions</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container mt-4">
    <div class="row">
        <div class="col-md-7">
            <h1 class="mb-3">Roles</h1>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Code</th>
                    <th>Name</th>
                    <th>Permissions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${roles}">
                    <td th:text="${r.code}">ADMIN</td>
                    <td th:text="${r.name}">Administrator</td>
                    <td>
                        <span class="badge text-bg-secondary me-1" th:each="p : ${r.permissions}" th:text="${p.code}">PERM</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(roles)}">
                    <td colspan="3" class="text-center">Chưa có role</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="col-md-5">
            <div class="card mb-4">
                <div class="card-body">
                    <h2 class="h5">Tạo role</h2>
                    <form th:action="@{/roles}" th:object="${createForm}" method="post">
                        <div class="mb-3">
                            <label for="code" class="form-label">Mã</label>
                            <input id="code" type="text" class="form-control" th:field="*{code}">
                        </div>
                        <div class="mb-3">
                            <label for="name" class="form-label">Tên</label>
                            <input id="name" type="text" class="form-control" th:field="*{name}">
                        </div>
                        <button type="submit" class="btn btn-primary">Lưu role</button>
                    </form>
                </div>
            </div>
            <div class="card">
                <div class="card-body">
                    <h2 class="h5">Gán quyền cho role</h2>
                    <form th:action="@{/roles/assign-permissions}" th:object="${assignForm}" method="post">
                        <div class="mb-3">
                            <label for="roleId" class="form-label">Role</label>
                            <select id="roleId" class="form-select" th:field="*{roleId}">
                                <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.code}">ADMIN</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Quyền</label>
                            <select multiple class="form-select" th:field="*{permissionIds}" size="8">
                                <option th:each="p : ${permissions}" th:value="${p.id}" th:text="${p.code}">PERM</option>
                            </select>
                            <div class="form-text">Giữ Ctrl/Cmd để chọn nhiều</div>
                        </div>
                        <button type="submit" class="btn btn-primary">Cập nhật quyền</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

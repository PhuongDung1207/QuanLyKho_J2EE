<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="navbar">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="/warehouses">WMS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/warehouses">Kho</a></li>
                    <li class="nav-item"><a class="nav-link" href="/uoms">Đơn vị tính</a></li>
                    <li class="nav-item"><a class="nav-link" href="/categories">Danh mục</a></li>
                    <li class="nav-item"><a class="nav-link" href="/products">Sản phẩm</a></li>
                    <li class="nav-item"><a class="nav-link" href="/users">Người dùng</a></li>
                    <li class="nav-item"><a class="nav-link" href="/roles">Roles</a></li>
                    <li class="nav-item"><a class="nav-link" href="/permissions">Permissions</a></li>
                </ul>
                <div class="d-flex">
                    <span class="navbar-text me-3" th:if="${session.AUTH_USERNAME != null}">
                        Xin chào, <span th:text="${session.AUTH_USERNAME}">admin</span>
                    </span>
                    <a class="btn btn-outline-light btn-sm" th:if="${session.AUTH_USERNAME == null}" href="/login">Đăng nhập</a>
                    <a class="btn btn-outline-warning btn-sm" th:if="${session.AUTH_USERNAME != null}" href="/logout">Đăng xuất</a>
                </div>
            </div>
        </div>
    </nav>
</div>
</body>
</html>

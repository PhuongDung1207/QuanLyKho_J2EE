<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý kho</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container mt-4">
    <h1 class="mb-4">Danh sách kho</h1>

    <div class="row">
        <div class="col-md-8">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Mã kho</th>
                    <th>Tên kho</th>
                    <th>Trạng thái</th>
                    <th>Sức chứa</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="warehouse : ${warehouses}">
                    <td th:text="${warehouse.code}">WH001</td>
                    <td th:text="${warehouse.name}">Kho trung tâm</td>
                    <td th:text="${warehouse.status}">ACTIVE</td>
                    <td th:text="${warehouse.capacity}">0</td>
                    <td>
                        <a class="btn btn-sm btn-outline-secondary"
                           th:href="@{'/warehouses/' + ${warehouse.id} + '/locations'}">Vị trí</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(warehouses)}">
                    <td colspan="5" class="text-center">Chưa có kho nào</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="col-md-4">
            <h2 class="h5">Thêm kho mới</h2>
            <form th:action="@{/warehouses}" th:object="${createForm}" method="post">
                <div class="mb-3">
                    <label for="code" class="form-label">Mã kho</label>
                    <input id="code" type="text" class="form-control" th:field="*{code}">
                    <div class="text-danger small" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                </div>
                <div class="mb-3">
                    <label for="name" class="form-label">Tên kho</label>
                    <input id="name" type="text" class="form-control" th:field="*{name}">
                    <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
                <div class="mb-3">
                    <label for="status" class="form-label">Trạng thái</label>
                    <input id="status" type="text" class="form-control" th:field="*{status}" value="ACTIVE">
                    <div class="text-danger small" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                </div>
                <div class="mb-3">
                    <label for="capacity" class="form-label">Sức chứa</label>
                    <input id="capacity" type="number" step="0.01" class="form-control" th:field="*{capacity}">
                </div>
                <button type="submit" class="btn btn-primary">Lưu kho</button>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

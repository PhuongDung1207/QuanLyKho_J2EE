<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sản phẩm</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8">
            <h1 class="mb-4">Danh sách sản phẩm</h1>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>SKU</th>
                    <th>Tên</th>
                    <th>Barcode</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${products}">
                    <td th:text="${p.sku}">SKU001</td>
                    <td th:text="${p.name}">Sản phẩm A</td>
                    <td th:text="${p.barcode}">1234567890</td>
                </tr>
                <tr th:if="${#lists.isEmpty(products)}">
                    <td colspan="3" class="text-center">Chưa có sản phẩm</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="col-md-4">
            <h2 class="h5">Thêm sản phẩm</h2>
            <form th:action="@{/products}" th:object="${createForm}" method="post">
                <div class="mb-3">
                    <label for="sku" class="form-label">SKU</label>
                    <input id="sku" type="text" class="form-control" th:field="*{sku}">
                </div>
                <div class="mb-3">
                    <label for="name" class="form-label">Tên</label>
                    <input id="name" type="text" class="form-control" th:field="*{name}">
                </div>
                <div class="mb-3">
                    <label for="categoryId" class="form-label">Category ID</label>
                    <input id="categoryId" type="text" class="form-control" th:field="*{categoryId}">
                </div>
                <div class="mb-3">
                    <label for="baseUomId" class="form-label">Base UoM ID</label>
                    <input id="baseUomId" type="text" class="form-control" th:field="*{baseUomId}">
                </div>
                <div class="mb-3">
                    <label for="barcode" class="form-label">Barcode</label>
                    <input id="barcode" type="text" class="form-control" th:field="*{barcode}">
                </div>
                <button type="submit" class="btn btn-primary">Lưu sản phẩm</button>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

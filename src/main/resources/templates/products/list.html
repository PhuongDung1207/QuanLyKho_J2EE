<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản phẩm – WMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="wms-main">
    <div class="container-fluid p-4">
        <div class="d-flex align-items-center mb-4">
            <div>
                <h1 class="h4 fw-bold mb-0" style="color:#1a1a2e"><i class="bi bi-box-seam me-2" style="color:#f26722"></i>Danh sách sản phẩm</h1>
                <p class="text-muted small mb-0">Quản lý tất cả sản phẩm trong hệ thống</p>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-8">
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-body p-0">
                        <table class="table table-hover mb-0">
                            <thead style="background:#f8fafc;">
                            <tr>
                                <th class="px-4 py-3 text-uppercase small text-muted fw-semibold border-0" style="font-size:.72rem;letter-spacing:.06em">SKU</th>
                                <th class="px-4 py-3 text-uppercase small text-muted fw-semibold border-0" style="font-size:.72rem;letter-spacing:.06em">Tên sản phẩm</th>
                                <th class="px-4 py-3 text-uppercase small text-muted fw-semibold border-0" style="font-size:.72rem;letter-spacing:.06em">Barcode</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="p : ${products}">
                                <td class="px-4 py-3 fw-semibold" th:text="${p.sku}">SKU001</td>
                                <td class="px-4 py-3" th:text="${p.name}">Sản phẩm A</td>
                                <td class="px-4 py-3 text-muted" th:text="${p.barcode}">1234567890</td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(products)}">
                                <td colspan="3" class="text-center py-5 text-muted">
                                    <i class="bi bi-inbox d-block mb-2" style="font-size:2rem;opacity:.3"></i>
                                    Chưa có sản phẩm
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-header bg-white border-0 pt-3 pb-2 px-4">
                        <h5 class="fw-bold mb-0" style="font-size:.95rem"><i class="bi bi-plus-circle me-2" style="color:#f26722"></i>Thêm sản phẩm</h5>
                    </div>
                    <div class="card-body px-4 pb-4">
                        <form th:action="@{/products}" th:object="${createForm}" method="post">
                            <div class="mb-3">
                                <label for="sku" class="form-label small fw-semibold">SKU</label>
                                <input id="sku" type="text" class="form-control rounded-2" th:field="*{sku}" placeholder="VD: SKU001">
                            </div>
                            <div class="mb-3">
                                <label for="name" class="form-label small fw-semibold">Tên</label>
                                <input id="name" type="text" class="form-control rounded-2" th:field="*{name}" placeholder="Tên sản phẩm">
                            </div>
                            <div class="mb-3">
                                <label for="categoryId" class="form-label small fw-semibold">Category ID</label>
                                <input id="categoryId" type="text" class="form-control rounded-2" th:field="*{categoryId}">
                            </div>
                            <div class="mb-3">
                                <label for="baseUomId" class="form-label small fw-semibold">Base UoM ID</label>
                                <input id="baseUomId" type="text" class="form-control rounded-2" th:field="*{baseUomId}">
                            </div>
                            <div class="mb-4">
                                <label for="barcode" class="form-label small fw-semibold">Barcode</label>
                                <input id="barcode" type="text" class="form-control rounded-2" th:field="*{barcode}">
                            </div>
                            <button type="submit" class="btn w-100 fw-semibold text-white rounded-2" style="background:#f26722;border:none">
                                <i class="bi bi-save me-1"></i>Lưu sản phẩm
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

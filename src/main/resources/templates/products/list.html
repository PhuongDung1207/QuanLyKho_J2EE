<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products – WMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; }

        /* Top bar */
        .page-topbar {
            background: #fff; border-bottom: 1px solid #e2e8f0;
            padding: 1rem 2rem; display: flex; align-items: center;
            justify-content: space-between; box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .page-topbar h1 { font-size: 1.15rem; font-weight: 700; margin: 0; color: #0f172a; }
        .page-topbar p  { font-size: 0.78rem; color: #64748b; margin: 0; }
        .btn-add-item {
            background: #f26722; color: #fff; border: none;
            border-radius: 8px; font-weight: 600; font-size: 0.85rem;
            padding: 0.48rem 1.1rem; display: inline-flex; align-items: center; gap: 6px;
            box-shadow: 0 2px 8px rgba(242,103,34,0.28); transition: background 0.18s, transform 0.15s;
        }
        .btn-add-item:hover { background: #d95a15; color: #fff; transform: translateY(-1px); }

        /* Main */
        .main-content { padding: 1.5rem 2rem; }

        /* Toolbar */
        .toolbar { display: flex; gap: 0.65rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
        .search-wrap { position: relative; flex: 1; min-width: 180px; }
        .search-wrap .bi-search {
            position: absolute; left: 11px; top: 50%;
            transform: translateY(-50%); color: #94a3b8; font-size: 0.9rem; pointer-events:none;
        }
        .search-input {
            width: 100%; padding: 0.48rem 0.75rem 0.48rem 2.1rem;
            border: 1px solid #e2e8f0; border-radius: 8px;
            font-size: 0.875rem; background: #fff; color: #1e293b; outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-input:focus { border-color: #f26722; box-shadow: 0 0 0 3px rgba(242,103,34,0.12); }

        /* Table card */
        .table-card {
            background: #fff; border-radius: 12px;
            border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.05);
        }
        .table { margin: 0; }
        .table thead th {
            background: #f8fafc; color: #64748b; font-size: 0.72rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.06em;
            border-bottom: 1px solid #e2e8f0; border-top: none;
            padding: 0.7rem 1rem; white-space: nowrap;
        }
        .table tbody td { padding: 0.8rem 1rem; vertical-align: middle; border-color: #f1f5f9; font-size: 0.875rem; }
        .table tbody tr { transition: background 0.12s; }
        .table tbody tr:hover { background: #f8fafc; }
        .table tbody tr:last-child td { border-bottom: none; }

        /* Icon badge */
        .item-icon {
            width: 36px; height: 36px; border-radius: 9px;
            background: linear-gradient(135deg, #10b981, #059669);
            display: inline-flex; align-items: center; justify-content: center;
            color: #fff; font-size: 1rem; flex-shrink: 0;
        }
        .item-info { display: flex; align-items: center; gap: 0.6rem; }
        .item-name { font-weight: 600; font-size: 0.875rem; color: #0f172a; }
        .item-sub  { font-size: 0.73rem; color: #94a3b8; }

        /* Code badge */
        .badge-code {
            background: #f0fdf4; color: #166534; font-size: 0.72rem; font-weight: 700;
            padding: 0.28em 0.72em; border-radius: 6px; letter-spacing: 0.04em;
            font-family: 'Courier New', monospace; display: inline-block;
        }

        /* Empty state */
        .empty-state { padding: 3rem 1rem; text-align: center; color: #94a3b8; }
        .empty-state .ei { font-size: 2.6rem; color: #cbd5e1; margin-bottom: 0.7rem; }

        /* Table footer */
        .table-footer {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.7rem 1rem; border-top: 1px solid #f1f5f9;
            background: #fafbfc; font-size: 0.8rem; color: #64748b;
        }

        /* Action btns */
        .btn-act {
            width: 30px; height: 30px; border-radius: 6px;
            border: 1px solid #e2e8f0; background: #fff; color: #64748b;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 0.83rem; transition: all 0.15s; cursor: pointer;
        }
        .btn-act:hover { background: #f1f5f9; color: #1e293b; border-color: #cbd5e1; }
        .btn-act.red:hover { background: #fee2e2; color: #b91c1c; border-color: #fca5a5; }

        /* Modal */
        .modal-content { border:none; border-radius:14px; overflow:hidden; }
        .modal-header { background: linear-gradient(135deg,#c44e11,#f26722); color:#fff; padding:1.1rem 1.4rem; border:none; }
        .modal-title { font-weight:700; font-size:0.98rem; }
        .modal-header .btn-close { filter:brightness(0) invert(1); opacity:0.85; }
        .modal-body  { padding:1.4rem; }
        .modal-footer{ border-top:1px solid #f1f5f9; padding:0.9rem 1.4rem; }
        .form-label  { font-size:0.82rem; font-weight:600; color:#374151; margin-bottom:0.3rem; }
        .form-control, .form-select {
            border-radius:8px; border:1px solid #d1d5db; font-size:0.875rem; transition:border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus, .form-select:focus { border-color:#f26722; box-shadow:0 0 0 3px rgba(242,103,34,0.13); }
        .btn-save { background:#f26722; color:#fff; border:none; border-radius:8px; font-weight:600; font-size:0.875rem; padding:0.5rem 1.3rem; transition:background 0.18s; }
        .btn-save:hover { background:#d95a15; color:#fff; }
        .btn-cancel2 { background:#f1f5f9; color:#374151; border:none; border-radius:8px; font-weight:600; font-size:0.875rem; padding:0.5rem 1.1rem; }
        .btn-cancel2:hover { background:#e2e8f0; }
    </style>
</head>
<body>
<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="wms-main">
    
    <!-- Page top bar -->
    <div class="page-topbar">
        <div>
            <h1><i class="bi bi-box-seam-fill me-2" style="color:#f26722"></i>Product Management</h1>
            <p>Manage all system products and resources</p>
        </div>
        <button class="btn-add-item" data-bs-toggle="modal" data-bs-target="#addProductModal" type="button">
            <i class="bi bi-plus-lg"></i> Add Product
        </button>
    </div>

    <div class="main-content">

        <!-- Toolbar: Search -->
        <div class="toolbar">
            <div class="search-wrap">
                <i class="bi bi-search"></i>
                <input type="text" class="search-input" id="searchInput" placeholder="Search by name, SKU, or Barcode...">
            </div>
        </div>

        <!-- Products Table -->
        <div class="table-card">
            <table class="table">
                <thead>
                <tr>
                    <th style="width:42px">#</th>
                    <th>PRODUCT</th>
                    <th>SKU</th>
                    <th>BARCODE</th>
                    <th style="width:140px">ACTIONS</th>
                </tr>
                </thead>
                <tbody id="productsBody">
                <tr th:each="p, stat : ${products}"
                    th:attr="data-name=${p.name}, data-sku=${p.sku}, data-barcode=${p.barcode}">
                    <td class="text-muted" style="font-size:0.82rem" th:text="${stat.count}">1</td>
                    <td>
                        <div class="item-info">
                            <div class="item-icon">
                                <i class="bi bi-box"></i>
                            </div>
                            <div>
                                <div class="item-name" th:text="${p.name}">Product Name</div>
                                <div class="item-sub" th:text="'Category: ' + (${p.categoryId} != null ? ${p.categoryId} : 'N/A')">Category</div>
                            </div>
                        </div>
                    </td>
                    <td>
                        <span class="badge-code" th:text="${p.sku}">SKU</span>
                    </td>
                    <td class="text-muted fw-medium" style="font-size:0.85rem">
                        <i class="bi bi-upc-scan me-1 text-secondary"></i>
                        <span th:text="${p.barcode != null ? p.barcode : 'N/A'}">12345678</span>
                    </td>
                    <td>
                        <div class="d-flex gap-1 align-items-center">
                            <button class="btn-act" type="button" title="View"><i class="bi bi-eye"></i></button>
                            <button type="button" class="btn-act text-primary" title="Update"
                                th:data-id="${p.id}"
                                th:data-sku="${p.sku}"
                                th:data-barcode="${p.barcode}"
                                th:data-name="${p.name}"
                                th:data-categoryid="${p.categoryId}"
                                th:data-baseuomid="${p.baseUomId}"
                                onclick="openEditModal(this)">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <form th:action="@{/products/{id}/lock(id=${p.id})}" method="post" class="m-0 p-0 d-inline">
                                <button type="submit" class="btn-act text-warning" 
                                        th:title="${p.status == 'LOCKED' ? 'Unlock' : 'Lock'}" 
                                        onclick="return confirm('Are you sure you want to change the lock status of this product?');">
                                    <i class="bi" th:classappend="${p.status == 'LOCKED' ? 'bi-unlock' : 'bi-lock'}"></i>
                                </button>
                            </form>
                            <form th:action="@{/products/{id}/delete(id=${p.id})}" method="post" class="m-0 p-0 d-inline">
                                <button type="submit" class="btn-act red text-danger" title="Delete" onclick="return confirm('Are you sure you want to delete this product?');">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                <!-- Empty state -->
                <tr th:if="${#lists.isEmpty(products)}">
                    <td colspan="5">
                        <div class="empty-state">
                            <div class="ei"><i class="bi bi-inbox"></i></div>
                            <p style="color:#475569;font-weight:600;margin-bottom:4px">No products yet</p>
                            <small>Click <strong>Add Product</strong> to initialize your first record</small>
                        </div>
                    </td>
                </tr>
                <!-- No search results (JS-controlled) -->
                <tr id="noResultRow" style="display:none">
                    <td colspan="5">
                        <div class="empty-state">
                            <div class="ei"><i class="bi bi-search"></i></div>
                            <p style="color:#475569;font-weight:600;margin-bottom:4px">No products found</p>
                            <small>Try a different keyword</small>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>

            <!-- Footer -->
            <div class="table-footer">
                <span id="tableCount" th:text="'Total: ' + ${#lists.size(products)} + ' product(s)'">0 product(s)</span>
                <div class="page-pills d-flex gap-1">
                    <button class="btn btn-sm" style="border-radius:6px;border:1px solid #e2e8f0;background:#fff;font-size:0.8rem;font-weight:500;" type="button">1</button>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- ===== Edit Product Modal ===== -->
<div class="modal fade" id="editProductModal" tabindex="-1" aria-labelledby="editProductModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editProductModalLabel">
                    <i class="bi bi-pencil-square me-2"></i>Edit Product
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="editForm" method="post">
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="editSku" class="form-label"><i class="bi bi-upc me-1 text-warning"></i>SKU <span class="text-danger">*</span></label>
                            <input id="editSku" name="sku" type="text" class="form-control" readonly style="background-color: #f8fafc; cursor: not-allowed;">
                        </div>
                        <div class="col-md-6">
                            <label for="editBarcode" class="form-label"><i class="bi bi-upc-scan me-1 text-info"></i>Barcode</label>
                            <input id="editBarcode" name="barcode" type="text" class="form-control" placeholder="Scan or enter barcode...">
                        </div>
                        <div class="col-md-12">
                            <label for="editName" class="form-label"><i class="bi bi-tag me-1 text-primary"></i>Product Name <span class="text-danger">*</span></label>
                            <input id="editName" name="name" type="text" class="form-control" placeholder="Enter product name..." required>
                        </div>
                        <div class="col-md-6">
                            <label for="editCategoryId" class="form-label"><i class="bi bi-bookmark me-1 text-success"></i>Sub-Category <span class="text-danger">*</span></label>
                            <select id="editCategoryId" name="categoryId" class="form-select" required>
                                <option value="">-- Select category --</option>
                                <option th:each="c : ${categories}" th:if="${c.parentId != null}" th:value="${c.id}" th:text="${c.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="editBaseUomId" class="form-label"><i class="bi bi-ruler me-1 text-secondary"></i>Base UoM <span class="text-danger">*</span></label>
                            <select id="editBaseUomId" name="baseUomId" class="form-select" required>
                                <option value="">-- Select UoM --</option>
                                <option th:each="u : ${uoms}" th:value="${u.id}" th:text="${u.name}"></option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel2" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn-save">
                        <i class="bi bi-save me-1"></i>Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- ===== Add Product Modal ===== -->
<div class="modal fade" id="addProductModal" tabindex="-1" aria-labelledby="addProductModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addProductModalLabel">
                    <i class="bi bi-box-seam-fill me-2"></i>Add New Product
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/products}" th:object="${createForm}" method="post">
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="sku" class="form-label"><i class="bi bi-upc me-1 text-warning"></i>SKU <span class="text-danger">*</span></label>
                            <input id="sku" type="text" class="form-control" th:field="*{sku}" placeholder="e.g. SKU001" required>
                        </div>
                        <div class="col-md-6">
                            <label for="barcode" class="form-label"><i class="bi bi-upc-scan me-1 text-info"></i>Barcode</label>
                            <input id="barcode" type="text" class="form-control" th:field="*{barcode}" placeholder="Scan or enter barcode...">
                        </div>
                        <div class="col-md-12">
                            <label for="name" class="form-label"><i class="bi bi-tag me-1 text-primary"></i>Product Name <span class="text-danger">*</span></label>
                            <input id="name" type="text" class="form-control" th:field="*{name}" placeholder="Enter product name..." required>
                        </div>
                        <div class="col-md-6">
                            <label for="categoryId" class="form-label"><i class="bi bi-bookmark me-1 text-success"></i>Sub-Category <span class="text-danger">*</span></label>
                            <select id="categoryId" class="form-select" th:field="*{categoryId}" required>
                                <option value="">-- Select category --</option>
                                <option th:each="c : ${categories}" th:if="${c.parentId != null}" th:value="${c.id}" th:text="${c.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="baseUomId" class="form-label"><i class="bi bi-ruler me-1 text-secondary"></i>Base UoM <span class="text-danger">*</span></label>
                            <select id="baseUomId" class="form-select" th:field="*{baseUomId}" required>
                                <option value="">-- Select UoM --</option>
                                <option th:each="u : ${uoms}" th:value="${u.id}" th:text="${u.name}"></option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel2" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn-save">
                        <i class="bi bi-save me-1"></i>Save Product
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    /* ── Live search filter ── */
    var searchInput = document.getElementById('searchInput');
    var noResultRow = document.getElementById('noResultRow');
    var tableCount  = document.getElementById('tableCount');

    function openEditModal(btn) {
        document.getElementById('editSku').value = btn.dataset.sku || '';
        document.getElementById('editBarcode').value = btn.dataset.barcode || '';
        document.getElementById('editName').value = btn.dataset.name || '';
        document.getElementById('editCategoryId').value = btn.dataset.categoryid || '';
        document.getElementById('editBaseUomId').value = btn.dataset.baseuomid || '';
        document.getElementById('editForm').action = '/products/edit/' + btn.dataset.id;
        
        var editModal = new bootstrap.Modal(document.getElementById('editProductModal'));
        editModal.show();
    }

    function applyFilter() {
        var q    = searchInput.value.toLowerCase();
        var rows = document.querySelectorAll('#productsBody tr[data-name]');
        var visible = 0;
        rows.forEach(function(row) {
            var name = row.dataset.name ? row.dataset.name.toLowerCase() : '';
            var sku = row.dataset.sku ? row.dataset.sku.toLowerCase() : '';
            var barcode = row.dataset.barcode ? row.dataset.barcode.toLowerCase() : '';
            
            var match = !q || name.includes(q) || sku.includes(q) || barcode.includes(q);
                           
            if (match) {
                row.style.display = '';
                visible++;
            } else {
                row.style.display = 'none';
            }
        });
        if (noResultRow) {
            noResultRow.style.display = (visible === 0 && rows.length > 0) ? '' : 'none';
        }
        if (tableCount) {
            tableCount.textContent = 'Showing: ' + visible + ' product(s)';
        }
    }

    if (searchInput) {
        searchInput.addEventListener('input', applyFilter);
    }
</script>
</body>
</html>
